<!DOCTYPE html>
<html>
<head>
    <title>ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">ShopEasy</h1><br>
        <input type="text" id="searchBox" class="form-control" placeholder="Search Product"><br>
        <button class="btn btn-primary" onclick="searchProduct()"> Search </button>
        <br><br>
        <div class="card" style="width:300px;">
            <img src="https://via.placeholder.com/300x200"class="card-img-top">
            <div class="card-body">
                <h3 id="productName">Laptop</h3>
                <h5> Price : $650</h5>
                <p>HP Laptop</p>
                <button class="btn btn-warning"> Add To Cart</button>
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
