<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
    </head>
    <body>
        <h2 align="center"> Student  Calculator</h2>
        <form action="calculator.php" method="post" align="center">
            
            <input type="number" name="num1" id="num1" placeholder="Enter num 1" required><br><br>
            <input type="number" name="num2" id="num2" placeholder="Enter num 2" required><br><br>
            <button onclick="cal('+')">Addition:</button>
            <button onclick="cal('-')">Subtraction:</button>
            <button onclick="cal('*')">Multiplication:</button>
            <button onclick="cal('/')">Division:</button>
            <h3 id="result"></h3>
        </form>
        <script>
            function cal(operator) {
                let num1=Number(document.getElementById('num1').value);
                let num2=Number(document.getElementById('num2').value);
                let result;
                switch(operator){
                    case '+':
                        result = num1 + num2;
                        break;
                    case '-':
                        result=num1-num2;
                        break;
                    case '*':
                           result=num1*num2;
                        break;
                    case '/':
                         result=num1/num2;
                        break;
                }
                document.getElementById('result').innerText = "Result: " + result;
            }
        </script>
            
    </body>
</html>
