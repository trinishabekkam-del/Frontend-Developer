<!DOCTYPE html>
<html>
    <head>
       <title>function example
       </title> 
    </head>
    <body>
        <h1 id="demo">Function Example</h1>
        <button onclick="fun()">Click Me</button>
        <script>
            let  ele=document.getElementById("demo")
            ele.addEventListener("click",fun)
            ele.innerHTML = "Hello, World!";
        </script>
    </body>
</html>
