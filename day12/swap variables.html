<!DOCTYPE html>
<html>
    <head>
        <title>Swap Variables in Array Destructuring</title>
    </head>
    <body>
        <h1>Swap Variables in Array Destructuring</h1>
        <p id="output"></p>
        <script>
            let a = 5;
            let b = 10;
            [a, b] = [b, a];
            const output = `a: ${a}, b: ${b}`;
            document.getElementById('output').innerHTML = output;
            console.log(output);
        </script>
    </body>
</html>
