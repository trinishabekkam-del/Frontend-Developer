<!DOCTYPE html>
<html>
<head>
<title>E-Commerce</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand">ShopEasy</a>
<inputtype="text" id="search" class="form-control w-25" placeholder="Search Product" onkeyup="searchProduct()">
</div>
</nav>
<div class="container mt-4">
<div class="row">
<div class="col-md-3">
<select id="filter" class="form-select" onchange="filterProduct()">
<option value="All">All</option>
<option value="Mobile">Mobile</option>
<option value="Laptop">Laptop</option>
<option value="Watch">Watch</option>
</select>
</div>
<div class="col-md-3">
<select id="sort" class="form-select" onchange="sortProduct()">
<option value="">Sort</option>
<option value="A-Z">Name A-Z</option>
<option value="Z-A">Name Z-A</option>
<option value="Low">Price Low-High</option>
<option value="High">Price High-Low</option>
</select>
</div>
</div>
<div class="row mt-4" id="products">
</div>
</div>
<script src="script.js">
    let products=[

{
id:1,
name:"Samsung Mobile",
price:20000,
category:"Mobile",
image:"https://via.placeholder.com/200"
},

{
id:2,
name:"HP Laptop",
price:55000,
category:"Laptop",
image:"https://via.placeholder.com/200"
},

{
id:3,
name:"Apple Watch",
price:30000,
category:"Watch",
image:"https://via.placeholder.com/200"
},

{
id:4,
name:"Dell Laptop",
price:60000,
category:"Laptop",
image:"https://via.placeholder.com/200"
},

{
id:5,
name:"Realme Mobile",
price:15000,
category:"Mobile",
image:"https://via.placeholder.com/200"
}

];

let wishlist=[];

display(products);

function display(data){

let output="";

data.forEach(function(item){

output+=`

<div class="col-md-4">

<div class="card shadow mb-4">

<img src="${item.image}" class="card-img-top">

<div class="card-body">

<h5>${item.name}</h5>

<p>₹ ${item.price}</p>

<p>${item.category}</p>

<button
class="btn btn-success">

Add to Cart

</button>

<button
class="btn btn-danger"
onclick="addWishlist(${item.id})">

❤ Wishlist

</button>

</div>

</div>

</div>

`;

});

document.getElementById("products").innerHTML=output;

}

function searchProduct(){

let text=document.getElementById("search").value.toLowerCase();

let result=products.filter(function(item){

return item.name.toLowerCase().includes(text);

});

display(result);

}

function filterProduct(){

let category=document.getElementById("filter").value;

if(category=="All")
{
display(products);
return;
}

let result=products.filter(function(item){

return item.category==category;

});

display(result);

}

function sortProduct(){

let value=document.getElementById("sort").value;

let temp=[...products];

if(value=="A-Z")
{

temp.sort(function(a,b){

return a.name.localeCompare(b.name);

});

}

else if(value=="Z-A")
{

temp.sort(function(a,b){

return b.name.localeCompare(a.name);

});

}

else if(value=="Low")
{

temp.sort(function(a,b){

return a.price-b.price;

});

}

else if(value=="High")
{
temp.sort(function(a,b){
return b.price-a.price;
});
}
display(temp);
}
function addWishlist(id){
let item=products.find(function(p){
return p.id==id;
});
wishlist.push(item);
alert(item.name+" Added to Wishlist");
}
</script>
</body>
</html>
