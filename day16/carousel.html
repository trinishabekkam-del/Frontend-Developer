<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bootstrap Carousel Example</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center mb-4">Bootstrap Carousel</h2>
    <div id="demo" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#demo" data-bs-slide-to="1" aria-label="Slide 2"> </button>
            <button type="button" data-bs-target="#demo" data-bs-slide-to="2" aria-label="Slide 3"> </button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/c:\Users\trini\Downloads\WhatsApp Image 2026-08-02 at 8.09.47 PM.jpeg" class="d-block w-50 mx-auto" alt="First Slide">
            </div>
            <div class="carousel-item">
                <img src="images/c:\Users\trini\Downloads\WhatsApp Image 2026-08-02 at 8.10.31 PM.jpeg" class="d-block w-50 mx-auto" alt="Second Slide">
            </div>
            <div class="carousel-item">
                <img src="images/c:\Users\trini\Downloads\WhatsApp Image 2026-08-02 at 8.11.05 PM.jpeg" class="d-block w-50 mx-auto" alt="Third Slide">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</div>
</body>
</html>
